appId: com.presentationcommander.server
productName: Presentation Commander Server
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!native/*/vendor-sdk'
  - '!native/*/src'
  - '!native/*/scripts'
  - '!native/*/binding.gyp'
  - '!native/*/build/Release/obj.target'
  - '!native/*/build/Release/.deps'
  - '!native/*/build/Makefile'
  - '!native/*/build/binding.Makefile'
  - '!native/*/build/config.gypi'
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/*.dll'
win:
  executableName: presentation-commander-server
  # x64 ONLY, deliberately. The NDI addons are native code and `npmRebuild` is
  # off, so an arm64 target just repackages whatever .node was last built —
  # v1.1.0/v1.2.0 shipped arm64 installers carrying x86-64 addons and an x64
  # NDI runtime, which cannot load at all. CI only builds windows-x64 (see
  # .github/workflows/release.yml), so there is no arm64 addon to ship. Add
  # arm64 back only alongside a matrix job that actually builds it.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-${arch}-portable.${ext}
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc sign every target. Without this electron-builder skips signing
  # entirely when no Developer ID is installed, and Gatekeeper on Apple
  # Silicon then refuses the standalone arm64/x64 builds outright
  # ("is damaged and can't be opened").
  identity: '-'
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # Each target needs an explicit arch list. Without one electron-builder
  # builds the host architecture only, which on this Mac silently produced
  # arm64-only Linux packages and no x64 at all.
  #
  # x64 ONLY, for the same reason as `win` above: the arm64 packages shipped an
  # aarch64 Electron binary with x86-64 NDI addons beside it. release.yml's
  # own comment already says arm64 NDI libs are unreliable, so x64 is the
  # honest coverage.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  maintainer: Allan Sargeant <allan.sargeant@gmail.com>
  category: AudioVideo
appImage:
  # ${arch} is required: without it the x64 and arm64 AppImages resolve to
  # the same filename and the second overwrites the first.
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
